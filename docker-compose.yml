services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev
      POSTGRES_DB: pulsewatch_development
    ports:
      - "5433:5432"
    volumes:
      - pulsewatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pulsewatch_redis:/data

volumes:
  pulsewatch_pg:
  pulsewatch_redis:
